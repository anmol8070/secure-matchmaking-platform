<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFBF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100A24" media="(prefers-color-scheme: dark)" />
    <title>Matchmaking Platform</title>
    <script>
      // Apply the saved (or system) theme before the first paint, so there is no flash.
      // Keep in sync with src/context/ThemeContext.jsx.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('mm.theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        root.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
